name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: deal-buster-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: deal-buster-macos-arm64
          # - os: macos-13
          #   target: bun-darwin-x64
          #   outfile: deal-buster-macos-x64
          - os: windows-latest
            target: bun-windows-x64
            outfile: deal-buster-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} ./index.tsx --outfile ${{ matrix.outfile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deal-buster-linux-x64
            deal-buster-macos-x64
            deal-buster-macos-arm64
            deal-buster-windows-x64.exe
          generate_release_notes: true
